
name: Update MM2 Values

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-values:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser requirements
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape latest values
        run: python scrape_supreme.py

      - name: Update value history
        run: python update_history.py

      - name: Save updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.json history.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update MM2 values"
            git push
          else
            echo "No changes to save."
          fi
